# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
# One package per channel (Phase 5, hand-maintained). The version-prefix strips the
# `emacs-<channel>-` tag prefix so each package's versions are bare CalVer dates
# (e.g. 2026-06-14) that `mise use @latest` / `mise up` roll within that channel —
# the literal word "master" otherwise breaks `@<channel>` resolution. {{.Version}} in
# `asset:` stays the FULL git tag, so the asset template is unchanged from v1.
# Phase 6: GENERATE this file from versions.toml (one package per channel) so adding
# a channel stays data-only.
#
# TARBALL LAYOUT (v2, releases after 2026-08-08): the real top-level dir is the STABLE
# `misemacs/` (Naming.inner_dir/0) and the tar ALSO carries a compat symlink named
# exactly {{.AssetWithoutExt}} -> misemacs, which is what every `src:` below resolves
# through (older releases: real tag-named dir, no symlink). Do NOT try to branch `src:`
# by version — mise's aqua backend IGNORES version_constraint/version_overrides (probed
# on mise 2026.8.3: the top-level branch always wins) — layout compat lives in the tar.
# The stable dir is the consumer-facing win: installs/<tool>/latest/misemacs/Emacs.app
# never moves, so one `ln -sfn` into ~/Applications survives `mise up` (README "Open it
# like an app"). Bound by registry_contract_test.exs + pipeline/package self-verify.
packages:
  - type: github_release
    name: djgoku/misemacs-emacs-master
    version_source: github_tag
    repo_owner: djgoku
    repo_name: misemacs-emacs-master
    description: Hermetically-built relocatable Emacs.app for macOS — master channel
    version_prefix: "emacs-master-"
    asset: misemacs-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz
    format: tar.gz
    checksum:
      type: github_release
      asset: SHASUMS256.txt
      algorithm: sha256
    supported_envs:
      - darwin/arm64
    overrides:
      - goos: darwin
        files:
          - name: emacs
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/Emacs"
          - name: emacsclient
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/bin/emacsclient"
          - name: etags
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/bin/etags"
          - name: ebrowse
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/bin/ebrowse"
          - name: emacs-app
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/bin/emacs-app"
          - name: enchant-2
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/Resources/enchant/bin/enchant-2"
          - name: enchant-lsmod-2
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/Resources/enchant/bin/enchant-lsmod-2"
    replacements:
      darwin: macos
  - type: github_release
    name: djgoku/misemacs-emacs-31
    version_source: github_tag
    repo_owner: djgoku
    repo_name: misemacs-emacs-31
    description: Hermetically-built relocatable Emacs.app for macOS — emacs-31 channel
    version_prefix: "emacs-31-"
    asset: misemacs-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz
    format: tar.gz
    checksum:
      type: github_release
      asset: SHASUMS256.txt
      algorithm: sha256
    supported_envs:
      - darwin/arm64
    overrides:
      - goos: darwin
        files:
          - name: emacs
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/Emacs"
          - name: emacsclient
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/bin/emacsclient"
          - name: etags
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/bin/etags"
          - name: ebrowse
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/bin/ebrowse"
          - name: emacs-app
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/bin/emacs-app"
          - name: enchant-2
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/Resources/enchant/bin/enchant-2"
          - name: enchant-lsmod-2
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/Resources/enchant/bin/enchant-lsmod-2"
    replacements:
      darwin: macos
