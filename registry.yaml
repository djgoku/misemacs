# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
# Frozen legacy Aqua registry for the existing emacs-<channel>-YYYY-MM-DD tags.
# New releases use signed Packslips and vYYYY.M.N tags, which the version_prefix
# values below exclude. Aqua @latest stays on the final legacy release; switch
# to packslip:github.com/djgoku/misemacs-emacs-<channel> for new releases.
# This file lives at the repo ROOT so mise resolves the short registry URL
# `MISE_AQUA_REGISTRIES=https://github.com/djgoku/misemacs` (a github.com
# <owner>/<repo> URL is only ever probed for registry.yaml at the root).
# Local test: MISE_AQUA_REGISTRIES=file://$PWD/registry.yaml mise ls-remote aqua:djgoku/misemacs-emacs-master
#
# One package per legacy channel. The version_prefix strips the
# `emacs-<channel>-` tag prefix so package versions are bare dates
# (e.g. 2026-06-14). {{.Version}} in `asset:` stays the full git tag.
#
# TARBALL LAYOUT (v2, releases after 2026-08-08): the real top-level dir is the STABLE
# `misemacs/` (Naming.inner_dir/0) and the tar ALSO carries a compat symlink named
# exactly {{.AssetWithoutExt}} -> misemacs, which is what every `src:` below resolves
# through (older releases: real tag-named dir, no symlink). Do NOT try to branch `src:`
# by version — mise's aqua backend IGNORES version_constraint/version_overrides (probed
# on mise 2026.8.3: the top-level branch always wins) — layout compat lives in the tar.
# The stable dir is the consumer-facing win: installs/<tool>/latest/misemacs/Emacs.app
# never moves for these legacy installs.
packages:
  - type: github_release
    name: djgoku/misemacs-emacs-master
    version_source: github_tag
    repo_owner: djgoku
    repo_name: misemacs-emacs-master
    description: "[DEPRECATED] Legacy Aqua releases only; use packslip:github.com/djgoku/misemacs-emacs-master for new signed releases"
    version_prefix: "emacs-master-"
    asset: misemacs-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz
    format: tar.gz
    checksum:
      type: github_release
      asset: SHASUMS256.txt
      algorithm: sha256
    supported_envs:
      - darwin/arm64
    overrides:
      - goos: darwin
        files:
          - name: emacs
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/Emacs"
          - name: emacsclient
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/bin/emacsclient"
          - name: etags
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/bin/etags"
          - name: ebrowse
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/bin/ebrowse"
          - name: emacs-app
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/MacOS/bin/emacs-app"
          - name: enchant-2
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/Resources/enchant/bin/enchant-2"
          - name: enchant-lsmod-2
            src: "{{.AssetWithoutExt}}/Emacs.app/Contents/Resources/enchant/bin/enchant-lsmod-2"
    replacements:
      darwin: macos
  - type: github_release
    name: djgoku/misemacs-emacs-30
    version_source: github_tag
    repo_owner: djgoku
    repo_name: misemacs-emacs-30
